openapi: 3.1.0
info:
  title: Human Binoculars API
  version: '0.1'
  description: Draft contract for website v2, pending review and implementation.
paths:
  /api/targets:
    get:
      operationId: listTargets
      summary: List the five supported targets
      responses:
        '200':
          description: Preset catalog with ICRS coordinates and explicit epochs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetCatalog'
        '500':
          description: Catalog unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/health:
    get:
      summary: Health
      operationId: health_api_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Gateway Timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/resolve:
    get:
      summary: Resolve
      operationId: resolve_api_resolve_get
      parameters:
      - name: name
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resolve'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Gateway
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '504':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Gateway Timeout
  /api/frames:
    get:
      summary: Frames
      operationId: frames_api_frames_get
      parameters:
      - name: ra
        in: query
        required: true
        schema:
          type: number
          minimum: 0
          exclusiveMaximum: 360
          title: Ra
      - name: dec
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          title: Dec
      - name: target_key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Target Key
      - name: detector
        in: query
        required: false
        schema:
          type: integer
          maximum: 6
          minimum: 1
          default: 6
          title: Detector
      - name: size
        in: query
        required: false
        schema:
          type: number
          maximum: 0.3
          minimum: 0.02
          default: 0.1
          title: Size
      - name: max_frames
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 60
          title: Max Frames
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Frames'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Gateway
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '504':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Gateway Timeout
  /api/frames/{id}.png:
    get:
      summary: Png
      operationId: png_api_frames__id__png_get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            image/png: {}
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Gateway
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '504':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Gateway Timeout
  /api/frames/{id}/diff.png:
    get:
      summary: Diff Png
      operationId: diff_png_api_frames__id__diff_png_get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            image/png: {}
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Gateway
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '504':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Gateway Timeout
  /api/photometry:
    get:
      summary: Photometry
      operationId: photometry_api_photometry_get
      parameters:
      - name: ra
        in: query
        required: true
        schema:
          type: number
          minimum: 0
          exclusiveMaximum: 360
          title: Ra
      - name: dec
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          title: Dec
      - name: target_key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Target Key
      - name: detector
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 6
            minimum: 1
          - type: 'null'
          title: Detector
      - name: aperture_arcsec
        in: query
        required: false
        schema:
          type: number
          exclusiveMinimum: 0
          default: 12.3
          title: Aperture Arcsec
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photometry'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Gateway
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '504':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Gateway Timeout
  /api/astrometry:
    get:
      summary: Astrometry
      operationId: astrometry_api_astrometry_get
      parameters:
      - name: ra
        in: query
        required: true
        schema:
          type: number
          minimum: 0
          exclusiveMaximum: 360
          title: Ra
      - name: dec
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          title: Dec
      - name: target_key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Target Key
      - name: detector
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 6
            minimum: 1
          - type: 'null'
          title: Detector
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Astrometry'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Gateway
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '504':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Gateway Timeout
components:
  schemas:
    TargetCatalogEntry: {"type": "object", "properties": {"target_key": {"type": "string", "enum": ["barnard", "wise0855", "epsindib", "rwaur", "rdra"]}, "name": {"type": "string"}, "aliases": {"type": "array", "items": {"type": "string"}}, "kind": {"type": "string", "enum": ["high_pm", "variable", "other"]}, "constellation": {"anyOf": [{"type": "string"}, {"type": "null"}]}, "ra": {"type": "number"}, "dec": {"type": "number"}, "epoch": {"type": "string"}, "pmra": {"anyOf": [{"type": "number"}, {"type": "null"}]}, "pmdec": {"anyOf": [{"type": "number"}, {"type": "null"}]}, "parallax_mas": {"anyOf": [{"type": "number"}, {"type": "null"}]}, "distance_ly": {"anyOf": [{"type": "number"}, {"type": "null"}]}, "source": {"type": "string"}, "detectors_recommended": {"type": "array", "items": {"type": "integer", "minimum": 1, "maximum": 6}}}, "required": ["target_key", "name", "ra", "dec", "epoch", "kind", "source"]}
    TargetCatalog: {"type": "object", "properties": {"api_version": {"type": "string", "const": "0.1"}, "targets": {"type": "array", "items": {"$ref": "#/components/schemas/TargetCatalogEntry"}}}, "required": ["api_version", "targets"]}
    Astrometry:
      properties:
        mode: {"type": "string", "enum": ["fixture", "live"]}
        data_kind: {"type": "string", "enum": ["observational", "illustrative"]}
        motion_detectable: {"anyOf": [{"type": "boolean"}, {"type": "null"}]}
        api_version:
          type: string
          const: '0.1'
          title: Api Version
          default: '0.1'
        target:
          $ref: '#/components/schemas/Target'
        catalog_pm:
          $ref: '#/components/schemas/CatalogPM'
        points:
          items:
            $ref: '#/components/schemas/AstrometryPoint'
          type: array
          title: Points
        fit:
          anyOf:
          - $ref: '#/components/schemas/MotionFit'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - target
      - catalog_pm
      - points
      - fit
      title: Astrometry
    AstrometryPoint:
      properties:
        predicted_px: {"anyOf": [{"type": "array", "items": {"type": "number"}, "minItems": 2, "maxItems": 2}, {"type": "null"}], "description": "Only present with a matching frame grid explicitly identified by sequence_id."}
        sequence_id: {"anyOf": [{"type": "string"}, {"type": "null"}]}
        frame_id:
          type: string
          title: Frame Id
        mjd:
          type: number
          title: Mjd
        measured:
          anyOf:
          - $ref: '#/components/schemas/Measurement'
          - type: 'null'
        predicted:
          anyOf:
          - $ref: '#/components/schemas/Position'
          - type: 'null'
        offset_arcsec:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Offset Arcsec
        measured_px:
          anyOf:
          - prefixItems:
            - type: number
            - type: number
            type: array
            maxItems: 2
            minItems: 2
          - type: 'null'
          title: Measured Px
      additionalProperties: false
      type: object
      required:
      - frame_id
      - mjd
      - measured
      - predicted
      - offset_arcsec
      - measured_px
      title: AstrometryPoint
    CatalogPM:
      properties:
        pmra:
          anyOf:
          - type: number
          - type: 'null'
          title: Pmra
        pmdec:
          anyOf:
          - type: number
          - type: 'null'
          title: Pmdec
        source:
          type: string
          title: Source
        epoch:
          type: string
          title: Epoch
      additionalProperties: false
      type: object
      required:
      - pmra
      - pmdec
      - source
      - epoch
      title: CatalogPM
    ErrorDetail:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        details:
          additionalProperties: true
          type: object
          title: Details
      additionalProperties: false
      type: object
      required:
      - code
      - message
      - details
      title: ErrorDetail
    ErrorResponse:
      properties:
        api_version:
          type: string
          const: '0.1'
          title: Api Version
          default: '0.1'
        error:
          $ref: '#/components/schemas/ErrorDetail'
      additionalProperties: false
      type: object
      required:
      - error
      title: ErrorResponse
    Frame:
      properties:
        detector: {"type": "integer", "minimum": 1, "maximum": 6}
        t_min_mjd: {"anyOf": [{"type": "number"}, {"type": "null"}]}
        t_max_mjd: {"anyOf": [{"type": "number"}, {"type": "null"}]}
        n_exposures: {"anyOf": [{"type": "integer", "minimum": 1}, {"type": "null"}]}
        frame_kind: {"type": "string", "enum": ["visit", "exposure", "synthetic"]}
        product_id: {"anyOf": [{"type": "string"}, {"type": "null"}]}
        product_ids: {"type": "array", "items": {"type": "string"}}
        id:
          type: string
          title: Id
        mjd:
          type: number
          title: Mjd
        iso:
          type: string
          title: Iso
        wavelength_um:
          type: number
          exclusiveMinimum: 0.0
          title: Wavelength Um
        bandwidth_um:
          type: number
          exclusiveMinimum: 0.0
          title: Bandwidth Um
        release:
          type: string
          title: Release
        survey:
          type: integer
          title: Survey
        bad_pixel_frac:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Bad Pixel Frac
        predicted_px:
          anyOf:
          - prefixItems:
            - type: number
            - type: number
            type: array
            maxItems: 2
            minItems: 2
          - type: 'null'
          title: Predicted Px
        png:
          type: string
          title: Png
        diff_png:
          type: string
          title: Diff Png
      additionalProperties: false
      type: object
      required:
      - id
      - mjd
      - iso
      - wavelength_um
      - bandwidth_um
      - release
      - survey
      - bad_pixel_frac
      - predicted_px
      - png
      - diff_png
      title: Frame
    Frames:
      properties:
        mode: {"type": "string", "enum": ["fixture", "live"]}
        data_kind: {"type": "string", "enum": ["observational", "illustrative"]}
        sequence_id: {"type": "string", "description": "Opaque identity of the ordered frames and their rendered representation."}
        data_credit: {"type": "string"}
        diff_norm: {"type": "object", "properties": {"vmin": {"type": "number"}, "vmax": {"type": "number"}, "zero_gray": {"type": "integer", "const": 128}}, "required": ["vmin", "vmax", "zero_gray"]}
        warning_details: {"type": "array", "items": {"type": "object", "properties": {"code": {"type": "string", "enum": ["SATURATION_POSSIBLE", "FEW_FRAMES", "TRUNCATED", "MIXED_WAVELENGTH", "TARGET_OUTSIDE_COVERAGE"]}, "frame_ids": {"type": "array", "items": {"type": "string"}}}, "required": ["code", "frame_ids"]}}
        api_version:
          type: string
          const: '0.1'
          title: Api Version
          default: '0.1'
        target:
          $ref: '#/components/schemas/Target'
        detector:
          type: integer
          maximum: 6.0
          minimum: 1.0
          title: Detector
        grid:
          $ref: '#/components/schemas/Grid'
        norm:
          $ref: '#/components/schemas/Norm'
        reference_frame_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Reference Frame Id
        frames:
          items:
            $ref: '#/components/schemas/Frame'
          type: array
          title: Frames
        warnings:
          items:
            type: string
            enum:
            - SATURATION_POSSIBLE
            - FEW_FRAMES
            - TRUNCATED
            - MIXED_WAVELENGTH
            - TARGET_OUTSIDE_COVERAGE
          type: array
          title: Warnings
      additionalProperties: false
      type: object
      required:
      - target
      - detector
      - grid
      - norm
      - reference_frame_id
      - frames
      - warnings
      title: Frames
    Grid:
      properties:
        size_deg: {"type": "number", "description": "Requested cutout width in degrees. Compute actual pixel footprint from WCS."}
        wcs: {"type": "object", "properties": {"crpix": {"type": "array", "items": {"type": "number"}, "minItems": 2, "maxItems": 2, "description": "FITS one-based reference pixel in the FITS raster, before the PNG vertical flip."}, "crval": {"type": "array", "items": {"type": "number"}, "minItems": 2, "maxItems": 2, "description": "Reference ICRS RA and Dec, in degrees."}, "cd": {"type": "array", "items": {"type": "array", "items": {"type": "number"}, "minItems": 2, "maxItems": 2}, "minItems": 2, "maxItems": 2, "description": "FITS CD matrix in degrees per pixel."}}, "required": ["crpix", "crval", "cd"]}
        width:
          type: integer
          exclusiveMinimum: 0.0
          title: Width
        height:
          type: integer
          exclusiveMinimum: 0.0
          title: Height
        pixscale_arcsec:
          type: number
          exclusiveMinimum: 0.0
          title: Pixscale Arcsec
        projection:
          type: string
          const: TAN
          title: Projection
        center_ra:
          type: number
          exclusiveMaximum: 360.0
          minimum: 0.0
          title: Center Ra
        center_dec:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Center Dec
      additionalProperties: false
      type: object
      required:
      - width
      - height
      - pixscale_arcsec
      - projection
      - center_ra
      - center_dec
      title: Grid
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Health:
      properties:
        limits: {"type": "object", "properties": {"size_min_deg": {"type": "number"}, "size_max_deg": {"type": "number"}, "max_frames_max": {"type": "integer", "minimum": 1}}, "required": ["size_min_deg", "size_max_deg", "max_frames_max"]}
        api_version:
          type: string
          const: '0.1'
          title: Api Version
          default: '0.1'
        status:
          type: string
          enum:
          - ok
          - degraded
          title: Status
        mode:
          type: string
          enum:
          - fixture
          - live
          - local
          - harvest
          - database
          - hybrid
          title: Mode
        fixture_targets:
          items:
            type: string
          type: array
          title: Fixture Targets
        irsa_reachable:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Irsa Reachable
        git_sha:
          type: string
          title: Git Sha
      additionalProperties: false
      type: object
      required:
      - status
      - mode
      - fixture_targets
      - irsa_reachable
      - git_sha
      title: Health
    Measurement:
      properties:
        ra:
          type: number
          exclusiveMaximum: 360.0
          minimum: 0.0
          title: Ra
        dec:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Dec
        err_arcsec:
          type: number
          minimum: 0.0
          title: Err Arcsec
      additionalProperties: false
      type: object
      required:
      - ra
      - dec
      - err_arcsec
      title: Measurement
    MotionFit:
      properties:
        pmra:
          type: number
          title: Pmra
        pmdec:
          type: number
          title: Pmdec
        pmra_err:
          type: number
          minimum: 0.0
          title: Pmra Err
        pmdec_err:
          type: number
          minimum: 0.0
          title: Pmdec Err
        n_points:
          type: integer
          minimum: 3.0
          title: N Points
        baseline_days:
          type: number
          minimum: 30.0
          title: Baseline Days
      additionalProperties: false
      type: object
      required:
      - pmra
      - pmdec
      - pmra_err
      - pmdec_err
      - n_points
      - baseline_days
      title: MotionFit
    Norm:
      properties:
        vmin:
          type: number
          title: Vmin
        vmax:
          type: number
          title: Vmax
        stretch:
          type: string
          const: asinh
          title: Stretch
      additionalProperties: false
      type: object
      required:
      - vmin
      - vmax
      - stretch
      title: Norm
    Photometry:
      properties:
        mode: {"type": "string", "enum": ["fixture", "live"]}
        data_kind: {"type": "string", "enum": ["observational", "illustrative"]}
        unit: {"type": "string", "const": "mJy"}
        aperture_arcsec: {"type": "number", "exclusiveMinimum": 0}
        api_version:
          type: string
          const: '0.1'
          title: Api Version
          default: '0.1'
        target:
          $ref: '#/components/schemas/Target'
        reference_star:
          anyOf:
          - $ref: '#/components/schemas/ReferenceStar'
          - type: 'null'
        points:
          items:
            $ref: '#/components/schemas/PhotometryPoint'
          type: array
          title: Points
        variability:
          anyOf:
          - $ref: '#/components/schemas/Variability'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - target
      - reference_star
      - points
      - variability
      title: Photometry
    PhotometryPoint:
      properties:
