openapi: 3.1.0
info:
  title: SPHEREx Community Forum API
  version: '0.1'
  description: Contract-first forum-v1.1 aligned with FORUM_BUSINESS_ANALYSIS.md supplied 2026-11-14. Planned, not
    implemented/deployed. Separate from science API.
  x-contract-revision: forum-v1.1
tags:
- name: Forum
  description: Public reads and authenticated contributions.
- name: Forum admin
  description: Revision review, visibility, reports, taxonomy and audit.
paths:
  /api/forum/me:
    get:
      operationId: forumGetMe
      tags:
      - Forum
      summary: Read own profile and role
      description: Protected DB role. Null display_name requires profile completion before contributions. Dependency
        failure503.
      x-implementation-status: planned
      security:
      - SupabaseBearer: []
      responses:
        '200':
          description: Successful response.
          headers:
            Cache-Control:
              description: Required on every forum response.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              example:
                api_version: '0.1'
                profile:
                  id: 11111111-1111-4111-8111-111111111111
                  display_name: Sky observer
                role: user
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
        '503':
          $ref: '#/components/responses/E503'
    patch:
      operationId: forumUpdateProfile
      tags:
      - Forum
      summary: Set own display name
      description: No role/email/identity changes.
      x-implementation-status: planned
      security:
      - SupabaseBearer: []
      responses:
        '200':
          description: Successful response.
          headers:
            Cache-Control:
              description: Required on every forum response.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              example:
                api_version: '0.1'
                profile:
                  id: 11111111-1111-4111-8111-111111111111
                  display_name: Sky observer
                role: user
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
        '503':
          $ref: '#/components/responses/E503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
            example:
              display_name: Sky observer
  /api/forum/hashtags:
    get:
      operationId: forumListTags
      tags:
      - Forum
      summary: List managed hashtags
      description: Public catalog; active/inactive unless filtered. slug ASC,id ASC. Counts current public revisions
        only.
      x-implementation-status: planned
      security:
      - {}
      - SupabaseBearer: []
      responses:
        '200':
          description: Successful response.
          headers:
            Cache-Control:
              description: Required on every forum response.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagsResponse'
              example:
                api_version: '0.1'
                hashtags:
                - tag:
                    id: 66666666-6666-4666-8666-666666666666
                    slug: spherex
                    display_name: SPHEREx
                    active: true
                    version: 1
                  published_post_count: 1
                next_cursor: null
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
        '503':
          $ref: '#/components/responses/E503'
      parameters:
      - $ref: '#/components/parameters/active'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
  /api/forum/admin/hashtags:
    post:
      operationId: forumCreateTag
      tags:
      - Forum admin
      summary: Create catalog hashtag
      description: Admin only. Normalize before unique slug check; collision409. Users cannot create tags.
      x-implementation-status: planned
      security:
      - SupabaseBearer: []
      responses:
        '201':
          description: Successful response.
          headers:
            Cache-Control:
              description: Required on every forum response.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
              example:
                api_version: '0.1'
                hashtag:
                  id: 66666666-6666-4666-8666-666666666666
                  slug: spherex
                  display_name: SPHEREx
                  active: true
                  version: 1
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
        '503':
          $ref: '#/components/responses/E503'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreate'
            example:
              slug: spherex
              display_name: SPHEREx
  /api/forum/admin/hashtags/{tag_id}:
    patch:
      operationId: forumUpdateTag
      tags:
      - Forum admin
      summary: Rename or deactivate tag
      description: Admin only, atomic expected_version check. Immutable slug/id, no deletion. Actual change required;
        increment version. History associations preserved.
      x-implementation-status: planned
      security:
      - SupabaseBearer: []
      responses:
        '200':
          description: Successful response.
          headers:
            Cache-Control:
              description: Required on every forum response.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
              example:
                api_version: '0.1'
                hashtag:
                  id: 66666666-6666-4666-8666-666666666666
                  slug: spherex
                  display_name: SPHEREx
                  active: false
                  version: 2
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
        '503':
          $ref: '#/components/responses/E503'
      parameters:
      - $ref: '#/components/parameters/tag_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagUpdate'
            example:
              expected_version: 1
              active: false
  /api/forum/posts:
    get:
      operationId: forumListPosts
      tags:
      - Forum
      summary: Search public posts
      description: Current approved contents only from published/non-deleted posts. published_at DESC,id DESC. q
        AND hashtag. Never expose proposed revision, even to author/admin.
      x-implementation-status: planned
      security:
      - {}
      - SupabaseBearer: []
      responses:
        '200':
          description: Successful response.
          headers:
            Cache-Control:
              description: Required on every forum response.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPostsResponse'
              example:
                api_version: '0.1'
                posts:
                - id: 22222222-2222-4222-8222-222222222222
                  author:
                    id: 11111111-1111-4111-8111-111111111111
                    display_name: Sky observer
                  published_revision_id: 55555555-5555-4555-8555-555555555555
                  title: Possible motion near Barnard Star
                  body: Could this change in position be motion or an image artifact?
                  hashtags:
                  - id: 66666666-6666-4666-8666-666666666666
                    slug: spherex
                    display_name: SPHEREx
                    active: true
                    version: 1
                  links:
                  - label: The Eyes
                    url: https://example.org/the-eyes?ra=269.4521&dec=4.6934
                  sky_context:
                    ra: 269.4521
                    dec: 4.6934
                    size: 0.1
                    detector: 6
                    target_key: barnard
                  published_at: '2026-11-14T10:00:00Z'
                  edited_at: null
                next_cursor: null
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
        '503':
          $ref: '#/components/responses/E503'
      parameters:
      - $ref: '#/components/parameters/q'
      - $ref: '#/components/parameters/hashtag'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
    post:
      operationId: forumCreateDraftPost
      tags:
      - Forum
      summary: Create post and initial draft
      description: Confirmed account and complete profile required. Unpublished post/draft, not submitted. Incomplete
        payload may be saved.
      x-implementation-status: planned
      security:
      - SupabaseBearer: []
      responses:
        '201':
          description: Successful response.
          headers:
            Cache-Control:
              description: Required on every forum response.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
              example:
                api_version: '0.1'
                workspace:
                  post:
                    id: 22222222-2222-4222-8222-222222222222
                    author:
                      id: 11111111-1111-4111-8111-111111111111
                      display_name: Sky observer
                    visibility: unpublished
                    version: 1
                    published_revision_id: null
                    working_revision_id: 55555555-5555-4555-8555-555555555555
                    published_at: null
                    edited_at: null
                    created_at: '2026-11-14T10:00:00Z'
                    updated_at: '2026-11-14T10:00:00Z'
                    visibility_reason: null
                  published_revision: null
                  working_revision:
                    id: 55555555-5555-4555-8555-555555555555
                    post_id: 22222222-2222-4222-8222-222222222222
                    number: 1
                    status: draft
                    version: 1
                    title: Possible motion near Barnard Star
                    body: Could this change in position be motion or an image artifact?
                    hashtag_ids:
                    - 66666666-6666-4666-8666-666666666666
                    links:
                    - label: The Eyes
                      url: https://example.org/the-eyes?ra=269.4521&dec=4.6934
                    sky_context:
                      ra: 269.4521
                      dec: 4.6934
                      size: 0.1
                      detector: 6
                      target_key: barnard
                    created_at: '2026-11-14T10:00:00Z'
                    updated_at: '2026-11-14T10:00:00Z'
                    submitted_at: null
                    reviewed_at: null
                    reviewed_by: null
                    rejection_reason: null
                    withdrawn_at: null
                  hashtags:
                  - id: 66666666-6666-4666-8666-666666666666
                    slug: spherex
                    display_name: SPHEREx
                    active: true
                    version: 1
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
        '503':
          $ref: '#/components/responses/E503'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftCreate'
            example:
              title: Possible motion near Barnard Star
              body: Could this change in position be motion or an image artifact?
              hashtag_ids:
              - 66666666-6666-4666-8666-666666666666
              links:
              - label: The Eyes
                url: https://example.org/the-eyes?ra=269.4521&dec=4.6934
              sky_context:
                ra: 269.4521
                dec: 4.6934
                size: 0.1
                detector: 6
                target_key: barnard
  /api/forum/posts/{post_id}:
    get:
      operationId: forumGetPublicPost
      tags:
      - Forum
      summary: Read public snapshot
      description: Always public shape. Pending edits never exposed even with owner/admin token. Unpublished/hidden/deleted404.
        Use workspace for private data.
      x-implementation-status: planned
      security:
      - {}
      - SupabaseBearer: []
      responses:
        '200':
          description: Successful response.
          headers:
            Cache-Control:
              description: Required on every forum response.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPostResponse'
              example:
                api_version: '0.1'
