        minLength: 1
        maxLength: 2048
      description: Opaque endpoint/filter/order/identity-bound cursor. Invalid/expired/mismatch400. Reset on filter
        change; no frozen snapshot.
    q:
      name: q
      in: query
      schema:
        type: string
        minLength: 0
        maxLength: 200
      description: Trimmed NFC case-insensitive accent-sensitive literal substring in public title OR body. Empty
        no filter. % and _ literal. AND hashtag.
    hashtag:
      name: hashtag
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 40
      description: 'One slug; trim/lowercase/remove leading # (URL encode # as %23). Unknown valid slug empty; inactive
        historic tags supported.'
    active:
      name: active
      in: query
      schema:
        type: boolean
      description: Tag catalog filter; omit for both. Editor requests true.
    visibility:
      name: visibility
      in: query
      schema:
        $ref: '#/components/schemas/Visibility'
      description: Own post visibility filter.
    revision_status:
      name: revision_status
      in: query
      schema:
        type: string
        enum:
        - draft
        - pending
        - rejected
        - withdrawn
      description: 'Own posts: status of the latest revision by number, AND visibility. A latest approved revision matches none of these values.'
    unread:
      name: unread
      in: query
      schema:
        type: boolean
      description: true unread, false read, omitted both.
    report_status:
      name: status
      in: query
      schema:
        type: string
        enum:
        - open
        - resolved
        - dismissed
        default: open
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: All POSTs. UUID per intent; reuse on retries. Actor+operation+resource scoped, minimum24h retention.
        Same payload replays success; mismatch/in-flight409. Recheck permissions. See guide.
  responses:
    E400:
      description: Invalid request parameters.
      headers:
        Cache-Control:
          description: Required on every forum response.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            api_version: '0.1'
            error:
              code: BAD_PARAM
              message: Invalid request parameters.
              details: {}
    E401:
      description: A valid access token is required.
      headers:
        Cache-Control:
          description: Required on every forum response.
          schema:
            type: string
            const: no-store
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            api_version: '0.1'
            error:
              code: UNAUTHORIZED
              message: A valid access token is required.
              details: {}
    E403:
      description: Operation not permitted.
      headers:
        Cache-Control:
          description: Required on every forum response.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            api_version: '0.1'
            error:
              code: FORBIDDEN
              message: Operation not permitted.
              details: {}
    E404:
      description: Resource not found.
      headers:
        Cache-Control:
          description: Required on every forum response.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            api_version: '0.1'
            error:
              code: NOT_FOUND
              message: Resource not found.
              details: {}
    E409:
      description: Resource changed or action conflicts with state.
      headers:
        Cache-Control:
          description: Required on every forum response.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            api_version: '0.1'
            error:
              code: CONFLICT
              message: Resource changed or action conflicts with state.
              details: {}
    E429:
      description: Too many requests.
      headers:
        Cache-Control:
          description: Required on every forum response.
          schema:
            type: string
            const: no-store
        Retry-After:
          schema:
            type: integer
            minimum: 1
          example: 30
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            api_version: '0.1'
            error:
              code: RATE_LIMITED
              message: Too many requests.
              details: {}
    E500:
      description: Internal processing error.
      headers:
        Cache-Control:
          description: Required on every forum response.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            api_version: '0.1'
            error:
              code: INTERNAL
              message: Internal processing error.
              details: {}
    E503:
      description: Forum dependency unavailable.
      headers:
        Cache-Control:
          description: Required on every forum response.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            api_version: '0.1'
            error:
              code: SERVICE_UNAVAILABLE
              message: Forum dependency unavailable.
              details: {}
  schemas:
    Role:
      type: string
      enum:
      - user
      - admin
    Visibility:
      type: string
      enum:
      - unpublished
      - published
      - hidden
    RevisionStatus:
      type: string
      enum:
      - draft
      - pending
      - approved
      - rejected
      - withdrawn
    Author:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          minLength: 1
          maxLength: 80
      required:
      - id
      - display_name
    Profile:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        display_name:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 80
          - type: 'null'
      required:
      - id
      - display_name
      description: Null means complete profile before contributing. Never expose email.
    MeResponse:
      type: object
      additionalProperties: false
      properties:
        api_version:
          type: string
          const: '0.1'
        profile:
          $ref: '#/components/schemas/Profile'
        role:
          $ref: '#/components/schemas/Role'
      required:
      - api_version
      - profile
      - role
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
      required:
      - display_name
      description: Trim and reject blank. Cannot assign role or another identity.
    Tag:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          minLength: 1
          maxLength: 40
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        active:
          type: boolean
        version:
          type: integer
          minimum: 1
      required:
      - id
      - slug
      - display_name
      - active
      - version
      description: Stable id/immutable slug. Admin edits name/active only; historical associations retained.
    TagCount:
      type: object
      additionalProperties: false
      properties:
        tag:
          $ref: '#/components/schemas/Tag'
        published_post_count:
          type: integer
          minimum: 0
      required:
      - tag
      - published_post_count
      description: Distinct published, non-deleted posts with tag on current approved revision only.
    TagCreate:
      type: object
      additionalProperties: false
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 40
        display_name:
          type: string
          minLength: 1
          maxLength: 80
      required:
      - slug
      - display_name
      description: 'Admin only. Trim, lowercase, remove leading #, then require ^[a-z0-9]+(?:-[a-z0-9]+)*$ and unique
        slug; active starts true.'
    TagUpdate:
      type: object
      additionalProperties: false
      properties:
        expected_version:
          type: integer
          minimum: 1
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        active:
          type: boolean
      required:
      - expected_version
      anyOf:
      - required:
        - display_name
      - required:
        - active
    Link:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        url:
          type: string
          minLength: 1
          maxLength: 2048
          format: uri
          pattern: ^https?://
      required:
      - label
      - url
      description: Only HTTP(S), valid host, no URL credentials. Store without fetching. Escape labels; no embeds
        or raw HTML.
    SkyContext:
      type: object
      additionalProperties: false
      properties:
        ra:
          type: number
          minimum: 0
          exclusiveMaximum: 360
        dec:
          type: number
          minimum: -90
          maximum: 90
        size:
          type: number
          minimum: 0.02
          maximum: 0.3
        detector:
          type: integer
          minimum: 1
          maximum: 6
        target_key:
          type: string
          minLength: 1
          maxLength: 80
        collection:
          type: string
          minLength: 1
          maxLength: 80
        t_min_mjd:
          type: number
        t_max_mjd:
          type: number
        product_ids:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          maxItems: 100
          uniqueItems: true
      required:
      - ra
      - dec
      - size
      - detector
      dependentRequired:
        t_min_mjd:
        - t_max_mjd
        t_max_mjd:
        - t_min_mjd
      description: Optional user context, not verified science. ICRS degrees, cutout size degrees, UTC MJD min<=max.
        collection/time/product_ids are metadata, not new /api/frames query fields. No transient PNG URL or automatic
        IRSA call.
    DraftCreate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 0
          maxLength: 150
        body:
          type: string
          minLength: 0
          maxLength: 20000
        hashtag_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 5
          uniqueItems: true
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          maxItems: 10
        sky_context:
          anyOf:
          - $ref: '#/components/schemas/SkyContext'
          - type: 'null'
      required: []
      description: Incomplete draft permitted. Defaults empty title/body/tags/links, null context. Submission requires
        trimmed title10-150, body20-20000, 1-5 active catalog tags.
    DraftUpdate:
      type: object
      additionalProperties: false
      properties:
        expected_version:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 0
          maxLength: 150
        body:
          type: string
          minLength: 0
          maxLength: 20000
        hashtag_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 5
          uniqueItems: true
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          maxItems: 10
        sky_context:
          anyOf:
          - $ref: '#/components/schemas/SkyContext'
          - type: 'null'
      required:
      - expected_version
      anyOf:
      - required:
        - title
      - required:
        - body
      - required:
        - hashtag_ids
      - required:
        - links
      - required:
        - sky_context
      description: Only current draft mutable. Omitted preserves, [] clears arrays, null clears context. Actual
        change required; increments revision/post versions.
    Revision:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        post_id:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/RevisionStatus'
        version:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 0
          maxLength: 150
        body:
          type: string
          minLength: 0
          maxLength: 20000
        hashtag_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 5
          uniqueItems: true
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          maxItems: 10
        sky_context:
          anyOf:
          - $ref: '#/components/schemas/SkyContext'
          - type: 'null'
        created_at:
          type: string
          format: date-time
          pattern: Z$
        updated_at:
          type: string
          format: date-time
          pattern: Z$
        submitted_at:
          anyOf:
          - type: string
            format: date-time
            pattern: Z$
          - type: 'null'
        reviewed_at:
          anyOf:
          - type: string
            format: date-time
            pattern: Z$
          - type: 'null'
        reviewed_by:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        rejection_reason:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 1000
          - type: 'null'
        withdrawn_at:
          anyOf:
          - type: string
            format: date-time
            pattern: Z$
          - type: 'null'
      required:
      - id
      - post_id
      - number
      - status
      - version
      - title
      - body
      - hashtag_ids
      - links
      - sky_context
      - created_at
      - updated_at
      - submitted_at
      - reviewed_at
      - reviewed_by
      - rejection_reason
      - withdrawn_at
      description: Private snapshot. Payload immutable after submission; workflow metadata may transition, incrementing
        version. Rejected/withdrawn/approved history never becomes draft again.
    VisibilityReason:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum:
          - hide
          - restore
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        actor_id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
          pattern: Z$
      required:
      - action
      - reason
      - actor_id
      - at
    PostState:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/Author'
        visibility:
          $ref: '#/components/schemas/Visibility'
        version:
          type: integer
          minimum: 1
        published_revision_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        working_revision_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        published_at:
          anyOf:
          - type: string
            format: date-time
            pattern: Z$
          - type: 'null'
        edited_at:
          anyOf:
          - type: string
            format: date-time
            pattern: Z$
          - type: 'null'
        created_at:
          type: string
          format: date-time
          pattern: Z$
        updated_at:
          type: string
          format: date-time
          pattern: Z$
        visibility_reason:
          anyOf:
          - $ref: '#/components/schemas/VisibilityReason'
          - type: 'null'
      required:
      - id
      - author
      - visibility
      - version
      - published_revision_id
      - working_revision_id
      - published_at
      - edited_at
      - created_at
      - updated_at
      - visibility_reason
      description: Private. At most one current public pointer and one working draft/pending. Hidden is independent
        of revision approval. deleted_at stays internal.
    Workspace:
      type: object
      additionalProperties: false
      properties:
        post:
          $ref: '#/components/schemas/PostState'
        published_revision:
          anyOf:
          - $ref: '#/components/schemas/Revision'
          - type: 'null'
        working_revision:
          anyOf:
          - $ref: '#/components/schemas/Revision'
          - type: 'null'
        hashtags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
      required:
      - post
      - published_revision
      - working_revision
      - hashtags
      description: Author/admin only; includes both snapshots and current catalog states. Historical snapshots use
        revision endpoints.
    PublicPost:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/Author'
        published_revision_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 10
          maxLength: 150
        body:
          type: string
          minLength: 20
          maxLength: 20000
        hashtags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          minItems: 1
          maxItems: 5
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          maxItems: 10
        sky_context:
          anyOf:
          - $ref: '#/components/schemas/SkyContext'
          - type: 'null'
        published_at:
          type: string
          format: date-time
          pattern: Z$
        edited_at:
          anyOf:
          - type: string
            format: date-time
            pattern: Z$
          - type: 'null'
      required:
      - id
      - author
      - published_revision_id
      - title
      - body
      - hashtags
      - links
      - sky_context
      - published_at
      - edited_at
      description: Current approved content only from a published/non-deleted post; never pending payload, review
        reasons or workflow pointers.
    RevisionCreate:
      type: object
      additionalProperties: false
      properties:
        base_revision_id:
          type: string
          format: uuid
        expected_post_version:
          type: integer
          minimum: 1
      required:
      - base_revision_id
      - expected_post_version
      description: Clone same-post approved/rejected/withdrawn snapshot to draft. Require no active draft/pending.
        Inactive copied tags must be replaced before submission.
    Transition:
      type: object
      additionalProperties: false
      properties:
        expected_revision_version:
          type: integer
          minimum: 1
        expected_post_version:
          type: integer
          minimum: 1
      required:
      - expected_revision_version
      - expected_post_version
      description: Compare both versions and required state atomically; stale/wrong state409.
    ReviewDecision:
      oneOf:
      - type: object
        additionalProperties: false
        properties:
          decision:
            type: string
            enum:
            - approve
          expected_revision_version:
            type: integer
            minimum: 1
          expected_post_version:
            type: integer
            minimum: 1
        required:
        - decision
        - expected_revision_version
        - expected_post_version
      - type: object
        additionalProperties: false
        properties:
          decision:
            type: string
            enum:
            - reject
          expected_revision_version:
            type: integer
            minimum: 1
          expected_post_version:
            type: integer
            minimum: 1
          reason_code:
            type: string
            enum:
            - off_topic
            - spam
            - abuse
            - personal_information
            - needs_context
            - other
          reason:
            type: string
            minLength: 1
            maxLength: 1000
        required:
        - decision
        - expected_revision_version
        - expected_post_version
        - reason_code
        - reason
      description: Admin only, no self-review. Approve requires tags still active, otherwise409 reason INACTIVE_HASHTAG.
        Reject requires nonblank reason; no silent content/tag rewriting.
    ReviewItem:
      type: object
      additionalProperties: false
      properties:
        post:
          $ref: '#/components/schemas/PostState'
        submitted_revision:
          $ref: '#/components/schemas/Revision'
        published_revision:
          anyOf:
          - $ref: '#/components/schemas/Revision'
          - type: 'null'
        hashtags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
      required:
      - post
      - submitted_revision
      - published_revision
      - hashtags
    VisibilityChange:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum:
          - hide
          - restore
        expected_version:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - action
      - expected_version
      - reason
      description: Admin explicit action, version and nonblank reason. Restore never revives author-deleted content.
    Comment:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        post_id:
          type: string
          format: uuid
        observed_revision_id:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/Author'
        body:
          type: string
          minLength: 1
          maxLength: 3000
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
          pattern: Z$
        updated_at:
          type: string
          format: date-time
          pattern: Z$
      required:
      - id
      - post_id
      - observed_revision_id
      - author
      - body
      - version
      - created_at
      - updated_at
      description: Single-level; observed_revision_id remains fixed when public post later changes.
    CommentCreate:
      type: object
      additionalProperties: false
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 3000
        observed_revision_id:
          type: string
          format: uuid
      required:
      - body
      - observed_revision_id
      description: Public parent required. Supplied observed_revision_id must equal current public revision, else409.
    CommentUpdate:
      type: object
      additionalProperties: false
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 3000
        expected_version:
          type: integer
          minimum: 1
      required:
      - body
      - expected_version
      description: Author only, visible comment under public parent; actual change increments version.
    ModeratedComment:
      type: object
      additionalProperties: false
      properties:
        comment:
          $ref: '#/components/schemas/Comment'
        visibility:
          type: string
          enum:
          - visible
          - hidden
        visibility_reason:
          anyOf:
          - $ref: '#/components/schemas/VisibilityReason'
          - type: 'null'
      required:
      - comment
      - visibility
      - visibility_reason
      description: Private author/admin view. Reporter identity never included.
    ReportCreate:
      type: object
      additionalProperties: false
      properties:
        target_type:
          type: string
          enum:
          - post
          - comment
        target_id:
          type: string
          format: uuid
        reason_code:
          type: string
          enum:
          - off_topic
          - spam
          - abuse
          - personal_information
          - other
        description:
          type: string
          minLength: 0
          maxLength: 2000
      required:
      - target_type
      - target_id
      - reason_code
      description: Only public target. Default description empty; other requires nonblank. One open report per reporter/target.
        Reports never auto-hide content.
    Report:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        target_type:
          type: string
          enum:
          - post
          - comment
        target_id:
          type: string
          format: uuid
        reason_code:
          type: string
          enum:
          - off_topic
          - spam
          - abuse
          - personal_information
          - other
        description:
          type: string
          minLength: 0
          maxLength: 2000
        status:
          type: string
          enum:
          - open
          - resolved
          - dismissed
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
          pattern: Z$
        updated_at:
          type: string
          format: date-time
          pattern: Z$
      required:
      - id
      - target_type
      - target_id
      - reason_code
      - description
      - status
      - version
      - created_at
      - updated_at
      description: Reporter receipt, no internal notes or other reporters.
    AdminReport:
      type: object
      additionalProperties: false
      properties:
        report:
          $ref: '#/components/schemas/Report'
        reporter_id:
          type: string
          format: uuid
        resolution_reason:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 1000
          - type: 'null'
        resolved_by:
          anyOf:
