  /api/forum/posts/{post_id}/revisions:
    get:
      operationId: forumListRevisions
      tags:
      - Forum
      summary: List revision history
      description: Author/admin only; others404. number DESC,id DESC. Preserve rejected/withdrawn/old-approved content
        snapshots.
      x-implementation-status: planned
      security:
      - SupabaseBearer: []
      responses:
        '200':
          description: Successful response.
          headers:
            Cache-Control:
              description: Required on every forum response.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionsResponse'
              example:
                api_version: '0.1'
