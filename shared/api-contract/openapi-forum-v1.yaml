    post:
      operationId: forumCreateRevision
      tags:
      - Forum
      summary: Clone snapshot into draft
      description: Author only; source same-post approved/rejected/withdrawn. Require no current draft/pending and
        exact post version. Preserve public pointer. Copied inactive tags must change before submission.
      x-implementation-status: planned
      security:
      - SupabaseBearer: []
      responses:
        '201':
          description: Successful response.
          headers:
            Cache-Control:
              description: Required on every forum response.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
              example:
                api_version: '0.1'
                workspace:
