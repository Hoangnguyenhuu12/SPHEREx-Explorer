                    dec: 4.6934
                    size: 0.1
                    detector: 6
                    target_key: barnard
                  published_at: '2026-11-14T10:00:00Z'
                  edited_at: null
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
        '503':
          $ref: '#/components/responses/E503'
      parameters:
      - $ref: '#/components/parameters/post_id'
    delete:
      operationId: forumDeletePost
      tags:
      - Forum
      summary: Author soft-deletes post
      description: Author only; admin cannot delete others. Hide revisions/comments and atomically withdraw active
        pending request so it cannot publish. Repeat owner204; missing/inaccessible404; no restore or hard deletion.
      x-implementation-status: planned
      security:
      - SupabaseBearer: []
      responses:
        '204':
          description: Soft-deleted, empty body. Same-owner repeat204 unless comment parent deleted404.
          headers:
            Cache-Control:
              description: Required on every forum response.
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
        '503':
          $ref: '#/components/responses/E503'
      parameters:
      - $ref: '#/components/parameters/post_id'
